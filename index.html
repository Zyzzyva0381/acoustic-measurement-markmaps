<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>声学测量 Markmap</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
      background: #f7f8fa;
      color: #1f2933;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }

    main {
      width: min(760px, calc(100vw - 48px));
    }

    h1 {
      margin: 0 0 12px;
      font-size: 32px;
      font-weight: 700;
    }

    p {
      margin: 0 0 28px;
      color: #52606d;
      line-height: 1.7;
    }

    nav {
      display: grid;
      gap: 14px;
    }

    a {
      display: block;
      padding: 18px 20px;
      border: 1px solid #d9e2ec;
      border-radius: 8px;
      background: #fff;
      color: #1d4ed8;
      font-size: 18px;
      font-weight: 650;
      text-decoration: none;
      box-shadow: 0 8px 22px rgba(15, 23, 42, 0.06);
    }

    a:hover,
    a:focus-visible {
      border-color: #1d4ed8;
      outline: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>声学测量 Markmap</h1>
    <p>请选择要查看的交互式思维导图。</p>
    <nav aria-label="Markmap 页面">
      <a href="./audio/">音频测量</a>
      <a href="./ultrasound/">超声测量</a>
    </nav>
  </main>
</body>
</html>
